# smtp-relay example configuration.
# Validate with:  smtp-relay -config config.yaml -check-config
#
# Rules:
#   - Unknown keys are an error (typos are caught).
#   - ${NAME} is replaced with the environment variable NAME. A bare $NAME is NOT replaced.
#     An unset variable is an error.
#   - Every secret has a *_file variant (e.g. password_file). Set one or the other, not both.
#   - Durations use Go syntax: 30s, 5m, 24h.

server:
  # Name used in the SMTP banner and in EHLO towards upstreams.
  # Use a real FQDN. Default: the system hostname.
  hostname: relay.home.lan
  # Optional text appended to the hostname in the 220 greeting ("220 relay.home.lan <text> ESMTP ...").
  welcome_message: ""

  # Default: [{address: "127.0.0.1:25", tls: none}]
  listen:
    - address: "0.0.0.0:25"
      tls: none            # none | starttls | tls
    # - address: "0.0.0.0:587"
    #   tls: starttls
    #   force_tls: true    # starttls only: refuse mail until the client upgrades to TLS
    # - address: "0.0.0.0:465"
    #   tls: tls

  # Required if any listener uses starttls or tls.
  # tls:
  #   cert_file: /etc/smtp-relay/tls.crt
  #   key_file: /etc/smtp-relay/tls.key
  #   profile: default     # default | modern (TLS 1.3+) | intermediate (TLS 1.2+, AEAD+ECDHE) | legacy (TLS 1.0+, weak ciphers)

  timeouts:
    read: 60s
    write: 60s
    data: 5m
    shutdown: 30s          # max wait for in-flight mails on SIGTERM

  # Every message is held in memory until it is delivered, so the worst case is about
  # max_message_size x max_connections (~1 GB at these defaults). Lower one of them on small hosts.
  limits:
    max_connections: 100   # -1 = unlimited; shared by all listeners
    max_message_size: 10240000   # bytes
    max_recipients: 100
    # Longest single protocol line in bytes (commands and DATA lines); minimum 1000, default 1048576.
    # Lines over the limit get 451 4.3.0 and the connection is closed. Only protocol lines are
    # buffered per connection, so the attack worst case is max_line_length x max_connections.
    # max_line_length: 1048576

access:
  # Who may connect. This is the ONLY gate: clients are not authenticated.
  # Default: [127.0.0.0/8, "::1/128"].
  # An empty list or 0.0.0.0/0 makes this an open relay and logs a warning.
  allowed_networks:
    - 192.168.0.0/16
    - 10.0.0.0/8

  # Allowed MAIL FROM addresses. If BOTH lists are empty, any sender is allowed.
  # The null sender <> is always rejected.
  # Matching is case-insensitive. Domains match exactly (no subdomains).
  allowed_senders:
    - noreply@example.com
  allowed_sender_domains:
    - example.com

# Real SMTP servers, in priority order: the first is tried first, and the relay
# moves down the list on any failure.
upstreams:
  - name: ses-eu                 # unique, [a-z0-9_-]+, used as a log/metric label
    host: email-smtp.eu-west-1.amazonaws.com
    port: 587                    # default by tls: starttls=587, tls=465, none=25
    tls: starttls                # starttls (required upgrade) | tls (implicit) | none
    auth:
      mechanism: auto            # auto | plain | login
      username: ${SES_SMTP_USER}
      password: ${SES_SMTP_PASS} # or: password_file: /run/secrets/ses_smtp_pass
      allow_insecure_auth: false # true allows credentials over an unencrypted connection (dev only)
    tls_options:
      insecure_skip_verify: false
      ca_file: ""                # custom CA bundle; empty = system roots
      client_cert_file: ""       # mutual TLS: set both cert and key, or neither
      client_key_file: ""
    timeouts:
      connect: 10s
      command: 30s               # per SMTP command
      data: 2m
    quota:                       # optional, SOFT: shown in metrics, never blocks mail
      limit: 50000               # messages
      window: 24h                # sliding window

  - name: smtp2go
    host: mail.smtp2go.com
    port: 2525
    tls: starttls
    auth:
      username: ${SMTP2GO_USER}
      password: ${SMTP2GO_PASS}
    quota:
      limit: 1000
      window: 24h

# Required when any upstream has a quota. Holds the quota counters so they
# survive restarts (saved at most every 10 s and on shutdown). One instance per file.
state:
  file: /var/lib/smtp-relay/state.json

logging:
  level: info                    # trace | debug | info | warn | error
  format: text                   # text | json
  output: stdout                 # stdout | stderr | file  (exactly one)
  # file:                        # used when output: file
  #   path: /var/log/smtp-relay/smtp-relay.log
  #   max_size_mb: 10
  #   max_backups: 3
  #   max_age_days: 30
  #   compress: true

# Also serves /healthz and /readyz on the same address. No authentication.
metrics:
  enabled: false
  listen: "127.0.0.1:9090"       # keep on loopback unless you firewall it
  path: /metrics
